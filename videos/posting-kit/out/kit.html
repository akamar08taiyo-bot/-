:root {
  --bg: #eceef2;
  --surface: #f9f9fb;
  --sunk: #e3e6ec;
  --ink: #1d2130;
  --muted: #5a6172;
  --line: #d3d7e0;
  --accent: #a85a08;
  --accent-soft: #f3e2cc;
  --on-accent: #ffffff;

  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --accent: #eda545; --accent-soft: #3a2a14; --on-accent: #1b1305; --night: #0c0e15; --night-ink: #efe9dc;
    --ok: #5dbf91; --warn: #e48a76; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1a1d27; --sunk: #232735; --ink: #e9e6df; --muted: #9ba2b2; --line: #2d3243;
  --accent: #eda545; --accent-soft: #3a2a14; --on-accent: #1b1305; --night: #0c0e15; --night-ink: #efe9dc;
  --ok: #5dbf91; --warn: #e48a76; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.75; }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mast { background: var(--night); color: var(--night-ink); padding-block: 28px 22px; padding-inline: 16px; }
.mast-in { max-width: 920px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.mast h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 34px); letter-spacing: 0.06em; }
.mast h1 a { color: inherit; text-decoration: none; }
.mast .kit { font-size: 13px; letter-spacing: 0.18em; opacity: 0.75; }
.mast .phrase { flex-basis: 100%; margin: 4px 0 0; font-family: var(--display); font-size: 15px; letter-spacing: 0.12em; opacity: 0.85; }

main { max-width: 920px; margin: 0 auto; padding-block: 24px 64px; padding-inline: 16px; display: grid; gap: 28px; }
.eyebrow { margin: 0; font-size: 12.5px; letter-spacing: 0.16em; color: var(--muted); }
h2, h3 { text-wrap: balance; }

/* 一覧 */
.lead { margin: 0; color: var(--muted); max-width: 60ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px; }
.card { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; text-decoration: none; color: inherit; }
.card:hover { border-color: var(--accent); }
.card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; background: var(--sunk); }
.card h2 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.4; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.card .meta .num { font-family: var(--mono); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

/* 各話 */
.back { font-size: 14px; text-decoration: none; }
.ep-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; align-items: start; }
.ep-head img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; background: var(--sunk); }
.ep-head h2 { margin: 2px 0 6px; font-family: var(--display); font-size: clamp(24px, 4.2vw, 32px); line-height: 1.35; }
.hookline { margin: 0 0 12px; font-family: var(--display); color: var(--accent); letter-spacing: 0.06em; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 14px; font-size: 13.5px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; font-family: var(--mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; counter-reset: step; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }

.step-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.step-h h3 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
.step-h h3 .n { font-family: var(--mono); font-size: 13px; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; min-width: 26px; height: 26px; display: inline-grid; place-items: center; }
.step-h .where { font-size: 12.5px; color: var(--muted); }
.check { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.check input { width: 17px; height: 17px; accent-color: var(--ok); }

.item { display: grid; gap: 8px; min-width: 0; }
.item + .item { border-top: 1px dashed var(--line); padding-top: 12px; }
.item-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.item-h .label { font-size: 13px; color: var(--muted); }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.count.over { color: var(--warn); }
.btns { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.flash { border-color: var(--ok); color: var(--ok); }
.btn.primary.flash { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.text { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; min-width: 0; }
.text.title { font-weight: 500; }
.text.long { max-height: 340px; overflow: auto; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.msg { font-size: 13px; color: var(--muted); min-height: 1em; }
.msg.err { color: var(--warn); }

.link-row { display: grid; gap: 4px; }
.url { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: 13px; }

.thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.thumb { display: grid; gap: 8px; align-content: start; min-width: 0; }
.thumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; background: var(--sunk); }
.thumb .rec { font-size: 12px; color: var(--accent); }

.player { display: grid; gap: 10px; }
.player video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; display: block; }
.dl { display: grid; gap: 6px; }
.dl .bar { height: 8px; }
.dl .bar > i { background: var(--accent); }

.toc { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; font-size: 14px; }
.toc dt { font-family: var(--mono); color: var(--muted); }
.toc dd { margin: 0; }

ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

.script { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.md { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; padding: 6px 16px; background: var(--bg); font-size: 14.5px; min-width: 0; }
.md h1 { font-family: var(--display); font-size: 22px; }
.md h2 { font-family: var(--display); font-size: 19px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 1.6em; }
.md h3 { font-size: 16px; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
.md th { background: var(--sunk); }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--sunk); padding: 0 4px; border-radius: 4px; }
.md pre { overflow-x: auto; background: var(--sunk); padding: 10px; border-radius: 6px; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }

.foot { text-align: center; padding-block: 8px 24px; font-family: var(--display); color: var(--muted); letter-spacing: 0.12em; }

@media (max-width: 720px) {
  .ep-head { grid-template-columns: minmax(0, 1fr); }
  .btns { margin-left: 0; }
  .step { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

はんこを押す。\n- **トラックの運転手と学校の先生は、すべてロボット**。\n- **なじみの店は看板ごと残っている**：喫茶店、牛丼屋、コンビニ。実在のチェーン店の名前・ロゴは使わず、色と雰囲気で思い出せるこの町のオリジナルの店にする（純喫茶「しおみ」、牛丼「つぎ家」のオレンジの看板、コンビニ「つぎマート」）。\n- **空中電車**：細い一本のレールにぶら下がって走る、丸みのある二両の電車（白と若草色）が、塔のあいだと古い瓦屋根の上を静かに渡る。\n- **職人とロボット**：左官・大工・鳶の職人は、ロボットと組んで町を直し、建てる。技は人がロボットに教える（鏝の返し方、足場の組み方）。\n- **神社は昔のまま**：島の高台の神社（鳥居、石灯籠、大きな銀杏）。人もロボットも手を合わせる。子どもたちの遊び場でもある。\n- **もうひとつの世界線**：ドラマ『VIVANT』の世界線へのオマージュとして、砂丘・スーツ姿の謎の男・ロボットが運転するトラックを、第二章の予告に置いた。\n  - 作品の固有名詞（組織名・国名・人物名）、登場人物、ロゴ、音楽、俳優の顔や姿は使わない（著作権と肖像への配慮）。\n  - 公開するタイトル・概要欄・タグにも『VIVANT』の名前は入れない（関係のない作品名で人を集めると、誤解を招く表示になるため）。\n\n### 共存の約束（このシリーズのルール）\n1. ロボットは人の仕事を奪わず、**人の手が足りないところを支える**（重い荷物、夜明けの配達、見守り）。\n2. **技と心は人から受け継ぐ**（中華そばの味、祭りの太鼓）。\n3. **捨てずに直す**（扇風機は修理されて家に帰ってくる）。\n4. 説明しない。台詞もナレーションもなく、**短いテロップと暮らしの動きだけ**で伝える（元動画の「説明しない」型）。最後のあいさつだけは元動画の締めくくりの型に合わせる。\n\n## 3. 絵と動きの作り方\n\n| 工程 | 内容 |\n|---|---|\n| 原画 | N04 の採用原画7枚（S01〜S07）＋今回 Gemini で生成した15枚（N01〜N15）。看板の文字やロボットのデザインは修正版を採用 |\n| 動き | 原画1枚ごとに Veo 3.1 Lite（1080p）で8秒の動画を生成。扉のカットだけ Veo 3.1 Fast |\n| スロー | 動き補間で24fps→60fps にしてから半速に。1カット約16秒の、夢の中のようなゆっくりした動き |\n| 合成（Remotion） | ゆっくり寄るカメラ、フィルムの粒子・周辺減光、空中電子版（カメラの動きを追跡して景色に貼りつける）、浮かび上がる文字、章題 |\n| つなぎ | すべて1.2秒のクロスフェード |\n\n### ご依頼の追加要素\n- **空中電子版**：漁港（本日の水揚げ）、湯けむりの坂（汐見館・足湯の案内）、商店街（8月24日（土）晴れ のち 雨）、空のりば（16:20 継島行き）、夏祭り（海上花火 20:40〜）。線が走り、板が開き、文字が1字ずつ灯る。カメラが動いても景色に貼りついて動く。\n- **文字が浮かび上がる**：テロップ・章題・タイトルは、1文字ずつぼかしから光って浮かび上がる。\n- **何もしなくても扉が開く**：空のりば（C5）の扉と、雨上がりの銭湯脇（D3）の引き戸が、誰も触れずに開く。\n\n## 4. 構成（7分05秒・27カット）\n\n| # | 時刻 | 章 | 場面（原画） | 動き | 文字 |\n|---|---|---|---|---|---|\n| H0 | 0:00 | 序（冒頭のつかみ） | ロボットが運転するトラック（G2）→ 透明な黒板の教室（G3）→ 空のりば（C5）→ 夏祭りの夜店（E1）を約4秒ずつ | 本編の動きをそのまま、短いディゾルブで。最後は黒へ | 初めて見るのに、帰りたくなる場所。 |\n| P0 | 0:14 | 序 | 夜明け前の桟橋と継島（N01） | 灯台の光、水面のゆらぎ、飛行車 | 2080年8月24日、土曜日。／海辺の町、継町（つぎまち）。／古いものを直しながら、人とAIが暮らす町。／**AIと人間の共存** |\n| A1 | 0:38 | 一 夜明け 午前五時四十分 | 朝焼けの漁港（N02） | 魚箱を運ぶロボット、漁師、カモメ | 電子版「本日の水揚げ」 |\n| A2 | 0:53 | 一 | 継島の階段路地（N03） | 牛乳瓶の箱を運ぶロボット | 牛乳は、今も瓶で届く。 |\n| B1 | 1:08 | 二 朝 午前七時四十分 | 渡し船（N04） | 揺れる船、飛行車 | 島から町へ、渡し船 ピ。」、夜店のざわめき（AI音声で作った短い会話を遠くにぼかしたもの）、遠くの祭り太鼓。\n  - Veo の音に勝手な音楽が入っていたカット（C3・D4・E1・G1）は、Veo の音を使わず合成音に差し替えた（G1 は竹ぼうきの音と鳥の声を合成）。\n  - 追加した音：回覧板のはんこ（「ポン」と小さな確認音）、透明な電子黒板のチョークの音（1文字ごとに「カツ」）。\n  - **人の声（せりふにはしない）**：AI音声で作った短い会話を0.4〜1.2秒に切って重ね、遠くにぼかした話し声・子どもの声・笑い声（本物の「ふふ」という笑いも）。商店街（B3）、回覧板（G1）、教室（G3）、中華そば（C1）、島の屋上（C3）、修理品の返却（D2）、夏祭り（E1・E2）、海上花火（E3）と、冒頭のつかみに入れた。言葉としては聞き取れない。\n- **テーマ曲（テーマ曲入り版のみ）**：作者が Suno で作った歌なしの曲4本（audio/suno/）から、場面に合う区間を選んで並べる（伸縮なし、audio/src/suno_plan.json）。オルゴールで始まり、朝はピアノと弦、昼は少しフルート、畳の居間は音を減らし、夕暮れはチャイムが鳴り終わってから哀愁のピアノ、祭りの間は曲なし、屋上の二人で冒頭と同じオルゴールが戻り、最後に静かに解決する。町のチャイム（ハ長調）と曲（イ長調）は重ねない。2026年10月までは、作曲から音作りまでプログラムで行った曲（compose.py）を使っていた\n- **終わりのあいさつ**：「つぎまちの一日に、最後までお付き合いいただき、ありがとうございました。また、この町でお会いしましょう。」（AI音声。元動画の締めくくりの型）\n- 公開音量：テーマ曲入り版 -14 LUFS、環境音のみ版 -16 LUFS（聞き流し向けに少し控えめ）。どちらもトゥルーピーク -1 dBTP 以下。曲は環境音より少し小さく置き、曲が乗りすぎる所だけゆっくり下げる（暮らしの音を埋めない）。\n\n## 6. 概要欄の文案\n\n貼り付け用の本文は [youtube_description.txt](youtube_description.txt)（タイトル2種・概要欄・環境音のみ版の差分・アップロード時の設定）。\n\n- タイトル（テーマ曲入り版）：`AIと人間の共存｜変わっていくもの、変わらないもの。僕の大好きなあの頃は、そのままに｜昭和を残した2080年の海辺の町【第一章】`\n- タイトル（環境音のみ版）：`AIと人間の共存｜変わっていくもの、変わらないもの。僕の大好きなあの頃は、そのままに【環境音のみ｜作業用・睡眠用】`\n- 概要欄の流れ：テーマの2行 → 作者の想い（変わる時代と希望、変わらないでほしいもの）→ 物語（町と一日）→ 台本について（自分で考え、何度も書き直した。ストーリーを大切に）→ 呼びかけ → 目次（章の時刻）→ 次回 → 架空・AI 生成の注記 → ハッシュタグ\n- アップロード時は、YouTube の「改変または合成されたコンテンツ」を「はい」にする。\n\n## 7. 続編（シリーズ化）の案\n\n- 第二章「砂の向こうから来た男」：2026年を生きる五十歳の男（昭和51年生まれ）が、四十年前に人がいなくなった生まれ故郷の島を訪ね、砂丘で2080年へ時を越える。昭和のままよみがえった島で、子どもの頃の遊び（缶蹴り、めんこ、焼きいも、かまくら、凧…）と、一生待ち続けた幼なじみの交換日記、その幼なじみが作ったロボットに出会う。台本は [chapter2_script.md](chapter2_script.md)\n- 第三章「台風の夜」：雨戸を打つ雨、停電の夜、ロボットの光の帯で過ごす家族（第二章の予告で予告）。\n- 第四章「秋の運動会」：継島の屋上の校庭で、人とロボットの二人三脚。\n- 第五章「雪の継町」：雪見の共同湯、こたつの猫とロボット。\n- 総集編「環境音のみ」作業用・睡眠用。\n\n## 8. チャンネル「記憶の路地裏」の言葉\n\n作者のチャンネルのコンセプト：「記憶の路地裏」は、ただ昔を懐かしむだけの場所ではない。仕事や子育て、日々の暮らしを頑張る人が、少し疲れたときに帰ってこられる場所。懐かしい景色に心を休ませ、また明日へ一歩踏み出せる場所。\n\n- **特に大切にしたい3つの言葉**：「帰れる場所があるから、また一歩、前へ進める。」「懐かしい昨日が、明日を生きる勇気になる。」「いつでも、ここに帰っておいで。」\n- **添え方の決まり**（作者の希望「ところどころに。ただし多く置きすぎない」）\n  - 動画では、冒頭のつかみに1行。ほかは多くても1〜2か所で、字幕の1行を**置き換える**形にして数を増やさない\n  - 説明には使わない。景色を見せたあとに、余韻として置く\n  - **声には出さない**。言葉はすべてテロップ（字幕）で見せる（作者の希望「言葉を喋る必要はない。テロップなどで」）\n  - 置くのは物語の節目：主人公の心の中が見える所（2026年の浜）、失ったものに気づく所（昭和の別れの朝）、一日の終わり。説明の字幕と同じ場面には重ねない\n  - 概要欄は、終わりに2行と「記憶の路地裏」。投稿キットのページは、見出しと結びに1行ずつ\n- **使ったところ**\n\n| 場所 | 言葉 |\n|---|---|\n| 第一章 冒頭のつかみ | 初めて見るのに、帰りたくなる場所。 |\n| 第二章 冒頭のつかみ | どこにもないのに、知っている景色。 |\n| 第二章 2026年の浜（P0、スマホの通知が鳴り続ける中、男が夕暮れの島へ歩く） | いつから、夕焼けを見なくなったんだろう。 |\n| 第二章 別れの朝（R6、1986年の桟橋。島を離れる少年と、残る女の子） | あれが最後の夏だったなんて。 |\n| 第二章 缶蹴り（D2、字幕を置き換え） | 夕方5時の、帰りたくない気持ち。 |\n| 第一章 灯りがともる湾（D4、字幕を置き換え。島の団地の窓に灯り） | 夕暮れの団地に、灯りがともる頃。 |\n| 第一章 結（F0、「第一章　了」のあと、あいさつの声と重ねて） | いつでも、ここに帰っておいで。 |\n| 第二章 結・両章の概要欄の頭 | 変わっていくものと、変わらないもの。／僕の大好きなあの頃は、そのままに。 |\n| 第一章の概要欄の終わり | 懐かしい昨日が、明日を生きる勇気になる。／いつでも、ここに帰っておいで。 |\n| 第二章の概要欄の終わり | 仕事に、子育てに、毎日を頑張るあなたへ。／少し疲れたときは、いつでも、ここに帰っておいで。 |\n| 投稿キットのページ | いつでも、帰っておいで。／帰れる場所があるから、また一歩、前へ進める。 |\n\n- **これからの章で使う候補**（作者の言葉の一覧から。場面と組にしておく）\n  - 「戻りたいわけじゃない。ただ、忘れたくない」：台風の夜、停電の茶の間\n  - 「あの頃は、明日が楽しみだった」：運動会の前の夜\n  - 「何もなかったけど、全部あった」：夕方の空き地・河川敷\n  - 「明日へ進むために、昨日へ帰る」：シリーズの結び\n  - 「新しくなるほど、恋しくなるもの」「遠ざかるほど、鮮やかになる」\n\n## 9. 2080年の町の引き出し（作者からの参考）\n\n作者から届いた「2080年×昭和平成の混ぜやすい要素」10組と「AIが創り出す未来の日本」40項目を、この町の決まりに合わせて整理したもの。**未来の技術は背景（遠く・上空・屋内の設備）に置き、手前は昭和の暮らし**、という見せ方は変えない。実現の見通しが【C】のもの（移動する都市）は使わない。空中に浮かぶ都市だけは、作者の参考写真（10節）に合わせて遠景の空に使う。\n\n### 混ぜやすい10組と、この町での形\n\n| 組み合わせ | この町での形 | 出た章・使う章 |\n|---|---|---|\n| 空飛ぶタクシー × 古い商店街 | 空のりばと継町商店街。上空を飛行車、下で八百屋と喫茶店 | 第一章（C5・B3） |\n| 自動配送ロボット × 駄菓子屋 | 荷物は配送カート、駄菓子は手渡し。子どもは**あえて小銭**で払う | 第一章 B3／第二章 B3（電話をあずける）。小銭の手元を次の章で |\n| AI住宅 × 昭和の茶の間 | 温度や灯りは家が整えるが、落ち着くのはちゃぶ台とブラウン管風の画面、古いカレンダー | 第二章 C3（麦茶）。第三章の茶の間 |\n| 無人バス × 団地 | 継島の団地は外見を残し、中だけ新しく。終点の団地へ無人バス | 第四章「秋の運動会」の朝 |\n| AR × 平成のゲームセンター | 商店街の奥に平成のゲームセンター（クレーンゲーム、写真シール、メダル） | 平成を描く章で |\n| 自動清掃の街 × 赤い郵便ポスト | 街はロボットが掃除しても、角の赤いポストは残る。「想いを送る文化」 | 交換日記の流れで、手紙を出す場面に |\n| 高層住宅 × 昭和の銭湯 | 健康と交流の場として残る共同湯 | 第一章 D3（銭湯脇）。第五章「雪の継町」の共同湯 |\n| AIコンビニ × 個人商店 | 無人のつぎマートと、人が接客する個人商店。**人の温度が貴重**になる | 商店街の場面で対にして |\n| 超高性能通信 × 公衆電話 | 駅前に記念として残る緑の公衆電話。若い人には新鮮、上の世代には懐かしい | 第三章（通信が止まった夜） |\n| 仮想空間の娯楽 × 河川敷・空き地 | 夕方になると人が集まるのは、何もない空き地 | 第二章の缶蹴りと同じ心。次の章の夕方 |\n\n### 「未来の日本」40項目から、この町で使うもの\n\n- **建物**：自分で自分を直す建物（04、町の「直して使う」と同じ考え）、2080年の昭和商店街（10、継町そのもの）、古い街並みを守る未来都市（28、町の約束）。人工樹木のマンション（05）と海上都市（08）は沖や丘の遠景に\n- **乗り物**：空飛ぶ自動運転タクシー（11、使用済み）、空中を走る透明列車（17、第二章の空中電車）、透明な海中列車（16、継島への新しい道。台風の夜は止まる）、家まで迎えに来る無人列車（15）、車内がリビングの車（13）\n- **街並み**：車が走らない住宅街（26、継町の坂道）、農業ビル（27、屋上菜園の先）、過去の風景が重なるAR（29）、森になる街（30）\n- **暮らし**：一人一台のロボット（31）、部屋が昭和の喫茶店になる（33）、AIの家庭教師（36、第一章の透明な黒板の先生）、立体映像で会う家族（35）。過去の街を仮想空間で歩く・思い出を映像で復元する・自分だけの懐かしい街（37〜39）は「記憶の路地裏」の芯に近いので、使うなら一章を使って丁寧に\n- **40「2080年、変わらず残るもの」**：夕焼けを美しいと感じる心、家族と過ごす何気ない時間、友達と笑い合った思い出、帰りたくなる場所。シリーズの結びの考え方として持っておく\n\n### 第三章「台風の夜」に使えそうなもの\n\n- 停電で家のAIが止まった茶の間：ちゃぶ台、ブラウン管風の画面に台風情報（止まる）、古いカレンダー。ロボットの光の帯とろうそくで過ごす\n- 通信が落ちた夜、駅前の公衆電話に小さな列。受話器を待つ人の手元だけ\n- 台風一過の朝：壁のひびが自然に閉じていく建物の横で、職人とロボットが雨戸を直す。赤いポストに手紙を出す子ども\n- 言葉の候補：「戻りたいわけじゃない。ただ、忘れたくない。」\n\n## 10. 作者の参考写真（2026年10月、13枚）\n\n置き場所：[assets/refs/user_2026-10/](../assets/refs/user_2026-10/)（`ref01.jpg`〜`ref13.jpg`、一覧は `sheet.jpg`）。原画を作るときは、場面の近い2枚を `gen_image.py` の `--refs` に渡して、光と色と町の見た目をそろえる。\n\n### 読み取ったこと（シリーズの見た目に足す決まり）\n\n- **時刻と光**：日没の前後（マジックアワー）。空は橙から紫、雪は青白く、店の灯り・提灯・石灯籠は琥珀色。手前は暖かく、奥は冷たい\n- **構図**：画面の片側を、灯りのともる木造の店や鳥居が囲む → 中央の道・石段・運河・線路が奥へ導く → 湾と町の灯り、吊り橋 → 雪の山並み → 空の右上に空中都市。人は小さく、後ろ姿\n- **空中都市**：尖塔の集まった島が雲の上に浮かび、光の輪が囲み、下には根のような構造が垂れる。まわりを小さな飛行車がいくつも飛ぶ。近くの看板や高架の電車にも「TSUGISHIMA SKY CITY」。9節では【C】として「使わない」と書いたが、**作者の参考に合わせて、遠景の空の主役として使う**（第一章・第二章はそのまま。次の章から空に足す）\n- **町の紋**：丸に桜（桜の五弁を丸で囲む）。のれん、提灯、旗、空中電車、配送ロボットに入っている。つぎ町の町章として使う\n- **三毛猫**：13枚のうち7枚に（石段、駅のベンチ、こたつのそば、駄菓子屋の前）。シリーズの「町の猫」として、毎章どこかに一度出す\n- **昭和の物**：丸ポスト、ブラウン管のテレビ、ブリキのロボット、招き猫、ガムボールの機械、駄菓子、こたつとみかん、石油ストーブ、ラジカセ、だるま、たぬきの置物、富士の掛け軸\n- **乗り物**：緑とクリームの二色の昭和の電車、レトロなバス、屋根付きの小舟、漁船、配送ロボット\n- **建物**：木造の商家、時計台、五重塔、灯台、鳥居（湾の小島にも）、石のアーチ橋、水車、木造の中学校（つぎ町立つぎ中学校）\n- **季節**：冬（雪）が11枚。春の夕焼け（雲の上の神社、空中都市の通り）が2枚\n- **言葉**：中学校の垂れ幕「未来もきっと、どこかでつながってる」。チャンネルの言葉の一つとして持っておく\n- **見た目**：写真より少し絵に寄った、細部の多い夕景。これまでの写真風（実写に見える質感）は保ったまま、光と色をこの参考に寄せる\n\n### 名前\n\n参考写真の看板は「次島空中都市」。シリーズの島は「継島（つぎしま）」なので、空中都市も「継島空中都市（TSUGISHIMA SKY CITY）」と書く。作者が「次島」の字を選んでいるなら、そちらに直す。\n\n### これからの章での使い道\n\n| 参考 | 場面 |\n|---|---|\n| ref01・ref06 | 雪の港と猫（第五章「雪の継町」の夜明けか夕方） |\n| ref02・ref10 | 雪の神社の石段から湾を見下ろす |\n| ref03・ref09 | 雪のバス停と駅、待つ人と猫 |\n| ref04・ref07 | 雪の運河、アーチ橋、屋根付きの小舟、招き猫の店 |\n| ref05 | 中学校の校庭の雪だるま（垂れ幕の言葉） |\n| ref08 | 駄菓子屋の坂と丸ポスト |\n| ref11 | こたつの茶の間から雪の町（9節「AI住宅×昭和の茶の間」と同じ心） |\n| ref12・ref13 | 雲の上の神社、空中都市の通り（食堂・珈琲店・配送ロボット）。春の章か、空中都市を描く章 |\n\n雪の夕景に空中都市が浮かぶ絵は、それだけで「何だこの世界は」になるので、サムネイルと冒頭のつかみにも向く。\n"}, "video": {"parts": [{"name": "v00", "path": "media/ep1/v00.mp4", "size": 18157155, "url": "/_blob/dd7b4381b70805ff54e644bc95894a33", "sha": "d12e1ad327225795912575c50927c4eb7b21e70a2e04821e4809551f0c143ced"}, {"name": "v01", "path": "media/ep1/v01.mp4", "size": 18911308, "url": "/_blob/9b710dca8df837b31233e11888bd87bb", "sha": "faeefc5387902a72483b51e4abeb9127242cfdb7171d3faf9f61eb6c47cf043f"}, {"name": "v02", "path": "media/ep1/v02.mp4", "size": 18304542, "url": "/_blob/54cc2235ae5a09ff0b49e610d4c4fb10", "sha": "9e300e7f49956016f59fc36a147d5cac906133330ba7aacbcb89dd1175003c2e"}, {"name": "v03", "path": "media/ep1/v03.mp4", "size": 19686820, "url": "/_blob/2ae8cbe5388fbfb30543f2ada780a6ff", "sha": "0fcda76b694a0cb5d78c5383004fe1d2d5e48d7f3340d869a7fa026fbd984781"}, {"name": "v04", "path": "media/ep1/v04.mp4", "size": 17554759, "url": "/_blob/4b8a234b5a2eb04b1fad84fc1ddd5811", "sha": "ee67d9842b0406863b9c52a13e1414401714410178abb13bf037ae17ebd7b7ad"}, {"name": "v05", "path": "media/ep1/v05.mp4", "size": 17825358, "url": "/_blob/bbacf2e3c12306e3b13927e985b7782e", "sha": "06605c57d10c17324363dc6e64b2377542f8b1797e1dd61490f59f51870a6a14"}, {"name": "v06", "path": "media/ep1/v06.mp4", "size": 19868595, "url": "/_blob/34ef0cd8695890696d597ac3af44f665", "sha": "d6afba2cd86ff8bc72ed5d2db4b8ee1414141560db839eae7707bedcaacc7851"}, {"name": "v07", "path": "media/ep1/v07.mp4", "size": 17511135, "url": "/_blob/a52ef590003c9 ト\n- **見てほしい人**：40代前半〜50代後半。子ども時代が昭和の終わり〜平成の初めの人\n- **語り**：ナレーションなし。せりふもほとんどなし。町の音と、短い字幕だけ。最後にあいさつの声\n\n## 見せ方の決まり（ドラマにしない）\n\n- **説明しない**：物語は、画面の中の物（カードの年、交換日記の日付、柱の傷、写真、お守り）と、同じ構図のくり返しで伝える。見る人が自分でつないで、気づく\n- **話さない**：人のせりふの字幕は、第一章からくり返す「来年も、いっしょに見ようね。」の一行だけ。人の声は、遠くの聞き取れないざわめき程度。ロボットは「ピ。」と鳴くだけ\n- **字幕は少なく**：日付と、町のことを書いた短い文だけ（全部で15行。第一章は23行）。登場人物の気持ちや、出来事のいきさつは書かない\n- **泣かせない**：顔を映さず、表情で見せない。カメラは引きで、ゆっくり。音楽で盛り上げすぎない\n- **答えを全部は見せない**：男がなぜ時を越えたのか、あの子がどうなったのかは、言葉では言わない。見る人によって受け取り方が少し違ってよい\n\n## この章で描くこと（作者の想い）\n\n- 時代が進むなかで、昔の懐かしい思い出がよみがえると、懐かしくて切なくなる。\n- 時代が変わって進化しても、昔の思い出は消したくない。\n- タイムスリップしたかのような体験とともに、一周して、昔の懐かしさや良さ、遊びに気づくときが帰ってくる。\n- 携帯電話を手放す。その代わりに、ミニ四駆や遊戯王、将棋で遊ぶ。秋と冬の遊びもある。\n- 授業参観、交換日記、夢やお父さんの仕事の発表。回想を交えながら、夢のある未来の世界も日々進化していく。\n- 40代前半〜50代後半の人が見とれて、しみじみする映像に。現代的な要素も忘れない。\n- 男は時代をタイムスリップして戻ってきた。\n- ドラマではない。見ている人が取り込まれて、推察するような感じ。話したりはほとんどしない。\n- 動画は7分から8分ぐらい。\n- チェーン店の看板などは残す。空中電車、喫茶店、吉野家などは残す。左官屋、建設業でロボットと共存。神社。\n\n## 画面に映ること\n\n2026年8月24日の夕暮れ。通知の鳴りやまないスマートフォンを持ったスーツの男が、人のいない団地の島を対岸に見ながら、砂丘へ入っていく。砂が舞い上がる。砂が晴れると夜で、対岸の島には灯りがともり、花火が上がっている。\n\n2080年8月25日、日曜日。ロボットの運転するトラックが、男を町まで乗せていく。浜のラジオ体操の列に、スーツの男がいる。手には、昭和61年のラジオ体操カード。最後の一枠にだけ、はんこがない。ロボットの先生が、そこにはんこを押す。\n\n商店街の純喫茶の窓ぎわで、モーニング。窓の外には、牛丼屋のオレンジの看板とコンビニの看板、その上を空中電車が渡っていく。坂の途中では、左官の親方がロボットに鏝の使い方を見せ、その向こうで職人たちとロボットが空中の橋を組んでいる。日曜の駄菓子屋では、子どもたちが電話を木の箱にあずけて遊ぶ。圏外のままの男の電話も、箱に入る。裏のコースで小さな四駆が走ると、同じ構図の昭和のコースで、少年と赤い髪どめの女の子が車を走らせている。路地では、めんこ、カード、ロボットとの将棋。\n\n昼の牛丼屋。古いロボットといっしょに渡る、島への船。古い団地の一室のちゃぶ台に、麦茶がふたつ。交換日記の最初のページは、子どものふたりの字。何十年もあいて、大人の女の人の字が毎年一枚ずつ続く。最後の一文はいつも同じ。字はだんだん震え、2069年で終わる。そのあとは、ロボットの四角い字と砂丘の絵。最後のページの絵には、砂丘とスーツの男。柱には、ふたり分の背くらべの線。どちらも昭和61年で止まっている。\n\n昭和の島。炭鉱の櫓が見える神社の境内で、秋の缶蹴り、ゴム跳び、めんこ、落ち葉の焼きいも。雪の正月の、かまくら、凧、羽子板、こま。授業参観の教室の壁には、町のロボットと同じ姿のロボットの絵。消えていく窓の灯り。屋上の花火。朝の桟橋で、女の子が少年の手に小さなお守りをのせる。\n\n高台の神社で、男が手を合わせ、となりでロボットも頭を下げる。社の脇の額の写真。2034年、お年寄りたちと最初のロボット、その真ん中に赤いカーディガンの白髪の女性。五時のチャイムは、昭和の島と同じ旋律。昭和と同じ境内での夕焼けの缶蹴りに、男もまざる。窓から呼ばれて、子どもたちが帰っていく。\n\n夜。消えた窓に、また灯りがともっている。赤い髪どめの子どもと線香花火。男がお守りをほどくと、子どもの丸い字で「おかえりなさい」。ロボットの光の帯が、ゆっくり明るくなる。屋上のベンチに、子どもと、ロボットと、男。\n\n## 見る人が推察する手がかり\n\n| 見る人が気づくこと | 手がかり（言葉では言わない） |\n|---|---|\n| 男は2026年から2080年へ来た | 序の字幕「2026年8月24日。」と、一の字幕「2080年8月25日、日曜日。」。砂が舞う切り替え。圏外のスマートフォン |\n| 男は、昭和にこの島で育った少年 | 昭和61年のラジオ体操カード。同じ構図の今のコースと昭和のコース。柱の傷に触れる手。お守り |\n| 女の子は、男の幼なじみ | 交換日記の最初のページの、子どものふたりの字。柱のふたり分の線（☆と♡）。最後の花火。別れの朝のお守り |\n| 女の子は、のちに最初のロボットを作った | 授業参観の壁の「しょうらいのゆめ」の、町のロボットと同じ姿の絵。2034年の写真の、最初のロボットと赤いカーディガンの女性 |\n| 女の子は、男を一生待っていた | 毎日ふたつの麦茶。交換日記の、毎年同じ最後の一文と、年々震えていく字 |\n| 女の子は、もういない | 交換日記の大人の字が2069年で終わり、そのあとはロボットの字 |\n| ロボットは、毎年砂丘で男を探していた | 日記の後ろのページの、毎年の砂丘の絵。最後の絵の、砂丘とスーツの男。砂丘で待っていたトラック |\n| 屋上の子どもは、あの子のひ孫 | 赤い髪どめ（あの子の赤と同じ色）。第一章の屋上の子 |\n| 島は一度、人がいなくなり、よみがえった | 2026年の暗い島、昭和の消えていく窓、今の灯りの島。同じ構図 |\n| 町は進んでも、なじみのものは残っている | 喫茶店のモーニング、牛丼屋とコンビニの看板、神社。昭和と今の同じ境内 |\n| 約束 | 第一章の屋上、昭和の屋上、今の屋上の、同じ構図。最後に一行だけの「来年も、いっしょに見ようね。」 |\n\n## 裏設定（画面では語らない）\n\n| 年 | できごと |\n|---|---|\n| 1976年（昭和51年） | 男が継島で生まれる。父は海の底の炭鉱で働く。団地の隣の部屋に、同い年の女の子（「あの子」） |\n| 1980年代前半 | 炭鉱の島はにぎやか。ふたりは神社の境内で缶蹴り、ゴム跳び、めんこ、落ち葉焚きをし、冬は雪合戦、正月は凧揚げをして育つ。同じ柱で背くらべをし、交換日記をつける |\n| 1986年（昭和61年）夏 | 炭鉱が閉じることになり、島から人がいなくなっていく。最後の授業参観で、少年は父の仕事の作文を読み、あの子は「ロボットを作る人になりたい」と絵に描く |\n| 1986年8月24日 | 最後の祭りの夜、屋上で「来年も、いっしょに見ようね。」 |\n| 1986年8月25日 | 朝、少年の家族は島を出る。あの子は「島に帰ってきたら開けて」と、手縫いのお守りを渡す。ラジオ体操カードの最後の一日は空いたまま。やがて島は無人になる |\n| 1986〜2026年 | 少年は都会で大人になり、会社員になる（昼は牛丼、休みの朝は喫茶店のモーニング）。お守りは開けないまま、カードといっしょに箱にしまってあった |\n| 2026年8月24日 | 最後の祭りから四十年目の日、五十歳の男は、カードとお守りを胸ポケットに入れて、無人の島の見える浜へ来る。夕暮れの砂丘で、男は時を越える（2026年の側では行方不明になる） |\n| 2034年 | ロボットの技術者になったあの子は、島に帰りたいお年寄りたちのために、最初のロボットを作り、無人の島を昭和の暮らしのまま直してよみがえらせる。町のロボットは、みんなこの一台の姿を受け継いでいる。あの子は毎日麦茶をふたつ用意し、毎年8月24日にはロボットに砂丘を見回ってもらう |\n| 2034〜2069年 | 島に人が戻り、消えた窓にまた灯りがともる。左官や大工、鳶の職人たちは、ロボットに技を教えながらいっしょに町を直していく。あの子は毎年8月24日、交換日記に一枚書く。最後の一文はいつも「来年も、いっしょに見ようね」 |\n| 2070年 | あの子が亡くなる。ロボットが、麦茶と交換日記と砂丘の見回りを受け継ぐ。日記には毎年、砂丘の絵を描く |\n| 2060〜2080年 | 町は進化を続ける（空中電車、ガラスの塔、空中の橋、飛行車）。それでも喫茶店も牛丼屋もコンビニも、看板ごと残っている。人々は一周して昔の遊びの良さに気づき、日曜は電話を木の箱にあずけて遊ぶのが町の習わしになる |\n| 2080年8月24日 | 第一章の祭りの夜。見回りのトラックが、砂丘で男を見つける。男は五十歳のまま |\n| 2080年8月25日 | 第二章 |\n\n## 登場するもの\n\n- **男** 看板、空中電車）、左官の親方とロボット・空中の橋を組む職人とロボット、昼の牛丼屋\n- 神社：昭和の秋の遊び（R1）と、今の参拝・夕焼けの缶蹴り（D1・D2）を、同じ高台の神社の境内にした\n- まとめた：昭和の炭鉱の島の引きの絵は、神社の秋の絵の奥（鳥居の向こうの櫓と団地）に入れた\n- 短くした：序の後半を22秒に、結を28秒に\n\n## テーマの置きどころ\n\n| 変わっていくもの | 変わらないもの | 希望 |\n|---|---|---|\n| 炭鉱が閉じ、島から人がいなくなった | ふたり分の柱の傷、毎日ふたつの麦茶 | 島は、ロボットといっしょによみがえった |\n| 2026年のスマートフォン、鳴りやまない通知 | 缶蹴り、めんこ、ゴム跳び、焼きいも、かまくら、凧、羽子板、こま | 時代が一周して、昔の遊びが帰ってきた |\n| 空中電車、ガラスの塔、空中の橋 | 喫茶店のモーニング、牛丼屋とコンビニの看板、神社 | 町は今日も新しくなり、子どもは宇宙を見上げる |\n| 店員も先生も運転手もロボットに | 左官の技、ラジオ体操のはんこ、五時のチャイム | 技は人からロボットへ受け継がれる |\n| 交換日記の字が、人からロボットに変わった | 毎年同じ最後の一文、屋上の約束 | 「おかえりなさい」 |\n\n## 第一章とのつながり\n\n- 予告の砂丘とミント色のトラック → 序\n- 回覧板「海岸のごみ拾い　8/25（日）朝6時」 → 一の浜のラジオ体操\n- 透明な黒板のロボットの先生 → ラジオ体操のはんこ\n- 「味は、親方から教わったもの。」 → 「壁の塗り方は、人がロボットに教える。」（技は人から）\n- 居間「誰かが、さっきまでここにいた。」 → 毎日ふたつの麦茶と交換日記\n- 「ひとつ、またひとつ、窓に灯りがともる。」 → 昭和の消えていく窓 → 「消えた窓に、また灯りがともる。」\n- 「五時のチャイムが、海の向こうまで響く。」 → 昭和の島と同じ旋律\n- 継島の屋上の小さな神社 → 高台の神社（昭和と今）\n- 屋上の二人「来年も、いっしょに見ようね。」「ピ。」 → 昭和の屋上の二人（同じ構図）→ 今の屋上の三人\n- ロボットはみんな同じ姿 → 授業参観の壁の絵と、2034年の写真の最初のロボット\n\n## 制作メモ\n\n- **原画**：新しく約28枚（P1 と R5 はサムネイル用に作った元絵をそのまま使える）。第一章と同じ場所（砂丘＝T0、居間＝C6、屋上＝E4、深夜の継島＝F0、商店街＝B3・G1）は、第一章の原画を参照画像に渡して同じ場所に見せる。居間（C3）は第一章の部屋の中をそのまま使い、窓の外だけ島の団地と海にする\n- **実在のチェーン店は、そのまま使わない**：吉野家などの実在の店名・ロゴ・看板の形は使わず（商標のため。生成AIも実在のロゴは崩したり断ったりする）、色と雰囲気で思い出せるこの町のオリジナルの店にする：牛丼「つぎ家」（オレンジの看板、コの字のカウンター）、コンビニ「つぎマート」（白地に色の帯）、純喫茶「しおみ」（窓の金文字、赤いビロードの椅子、サイフォン）。看板の字が崩れたら、板に貼る表示で直す。実在の店名は字幕・タイトル・概要欄・タグにも入れない\n- **空中電車**：細い一本のレールにぶら下がって走る、丸みのある二両の電車（白と若草色）。塔のあいだと古い瓦屋根の上を、静かに渡る。これからの章でも同じ姿にする\n- **左官と職人**：左官の親方は年配の職人（後ろ姿）、道具は鏝と鏝板、壁は蔵の白い漆喰。鳶と大工はヘルメットとニッカポッカ。ロボットは道具を受け取り、人の手つきをまねる側（技は人から）\n- **神社**：島の高台の小さな神社（鳥居、石灯籠、狛犬、大きな銀杏、石段）。昭和の秋（R1）は銀杏が黄色、今の夏（D1・D2）は青い。R1 と D2 は同じ構図\n- **2026年の島（P0）**：人がいなくなって40年の、草におおわれた団地の島（実在の島には似せすぎない）\n- **昭和の島（R1〜R6）**：昭和50〜60年代の暮らしを細かく入れる（ぎっしりの洗濯物、木の机、黒板、作業着の父親、エプロンの母親、おかっぱ、手編みのセーター、ラムネ、シールを貼ったノート）。秋（R1）と雪の正月（R2）は、遊びを一枚の絵に何種類も入れて、隅々まで見られる絵にする。色は昭和のカラー写真のように褪せさせて暖かく。昭和の絵は「本物の写真」「線画やアニメにしない」「白い縁を付けない」と強く書く（書かないとイラストになった）\n- **同じ構図で時をつなぐ**：B4 と B5（コース）、R1 と D2（神社の境内）、R4 と E1（島の窓）、R5 と E4（屋上）は、それぞれ同じ構図にする。言葉の代わりに、構図で時間をつなぐ\n- **赤い色**：あの子の赤い髪どめ、2034年の写真の赤いカーディガン、屋上の子どもの赤い髪どめ。人物の持ち物の赤はこの三つだけにして、見る人が気づけるようにする（店の看板や鳥居の赤は、くすんだ朱色にして区別する）\n- **男・少年・あの子**：顔を映さない（後ろ姿・遠景・手元）。男は全カットの指示文に「濃紺のスーツ、白髪まじりの短い髪、焦げ茶の革の鞄」、少年は「半袖・半ズボン・野球帽（冬はセーターとマフラー、祭りの夜は甚平）」、あの子は「おかっぱに赤い髪どめ（冬は赤いカーディガン、祭りの夜は浴衣）」を入れて、同じ人に見せる\n- **古いロボット**：町のロボットと同じ設計（目も口もなく、顔の代わりに琥珀の光の帯）。塗装のはげ・色の違う継ぎ当て・肩の手書きの番号で古さを出す\n- **画面の中の文字**：カード、交換日記、柱、額の札、お守りの紙、店の看板は「板に貼る表示」で重ねる。読めるのは日付と短い言葉だけにして、文章は読ませない。字の書き分けは、あの子の子どもの字が丸文字（Hachi Maru Pop）、少年の字が鉛筆の子どもの字（Yomogi）、大人のあの子の字がペン字（Klee One）、ロボットの字が四角くていねいに（Zen Maru Gothic）。どれも OFL の無料フォント\n- **遊び道具は、実在の商品に似せない**：ミニ四駆・遊戯王は商品名・作品名なので、「小さな四駆のおもちゃとコース」「オリジナルの絵柄のカード」として描き、ロゴ・実在のカードの絵柄・キャラクターは使わない。めんこや凧の絵柄もオリジナル。名前は字幕・タイトル・概要欄・タグにも出さない。将棋はそのまま\n- **電話**：2026年のスマートフォンは、ロゴのない今風の黒い板。2080年の電話は薄いガラスの板\n- **手元のカット**（A2・B3・B4・C4・C5・C6・E3）は手の形が崩れやすい。Veo の結果を必ず確かめ、崩れたら動きを小さくする\n- **音**：人の声は、遠くの聞き取れないざわめきだけ（作文、ゴム跳びの歌、夕飯の呼び声も聞き取れない程度に）。昭和の島は環境音を遠く、こもった音にする。実在のラジオ体操の曲は著作権があるので使わない。五時のチャイムは第一章のオリジナル旋律で、昭和の島でも同じ旋律にする（音で時をつなぐ）。R6 の汽笛は長く\n- **テーマ曲**：第一章の主題を使う。昭和の島はオルゴールだけで静かに。E3 で主題を少しだけ大きくし、結で静かに閉じる。盛り上げすぎない\n- **もうひとつの世界線**：第一章と同じ扱い。砂丘・スーツの男・鞄・時を越えたなぞ、という雰囲気だけで、作品名・人物・ロゴ・音楽は使わない\n- **費用の目安**：約22〜26ドル（画像 約28枚＋Veo Lite 30本）\n\n## 第8版：制作で決めたこと（2026年10月）\n\n制作中に足したもの・変えたものを、ここにまとめる（作業フォルダは `videos/ai-human-coexistence-2/`）。\n\n- **尺**：7分37秒・30カット。Veo の後半が崩れたカットは、使う所だけにした：R1 神社の秋は11秒（子どもの顔がこちらを向く前まで）、B3 電話をあずけるは10.6秒（店番のロボットの顔の形が変わる前まで）、T0 予告は前半5秒をさらにゆっくりにして16秒（男が振り向く前まで）、E2 線香花火は前半4.2秒をゆっくり伸ばして16秒（後半で火の玉が爆発のように大きくなったため）、A1 は頭の2.3秒（顔の映り込み）を切った\n- **喫茶店（B1）**：窓ぎわの席の女の人が話しかけるだけで、空中のタブレットに手順（プログラム）が一行ずつ刻まれる。「もし　雨がふったら」「　洗濯物を　とりこむ」「　「ピ。」と鳴らす」。声は遠くて聞き取れない程度。タブレットの前で女の人の顔は隠れる\n- **左官（B2）**：休んでいる職人たちに、近所のおばちゃんがおにぎりと麦茶を差し入れ。職人の一人はロボットに濡れ手ぬぐいを渡す\n- **ラジオ体操のカード（A2）**：カードの下の段を白紙に直して「昭和61年　夏休み」「ラジオ体操　出席カード」と印刷。ロボットの先生が押した枠には、朱色の「済」。それまでは、その一枠だけが空いている\n- **交換日記（C4）**：左は子どものふたりの字（1986.8.23 くもり「あしたは　おまつり。☆」／1986.8.24 はれ「おまつり、たのしかったね。はなび、きれいだったね。らいねんも、いっしょに見ようね。やくそく ♡」）。めくると大人のペン字で 2026.8.25・2027.8.24 → 2034・2035 → 2068・2069。最後の一文はいつも「来年も、いっしょに見ようね。」。字はだんだん震える\n- **日記のつづき（C5）**：ロボットの四角い字で「2079.8.24　はれ」「2080.8.24　はれ」と、砂丘の絵（最後の絵にスーツの男）\n- **柱の傷（C6）**：ふたり分の線の、同じ高さに「☆S61」「S61♡」（Veo が描いた線のうち、上に伸びすぎた所は木目で消した）\n- **授業参観（R3）**：黒板に「授業参観」「7月19日（土）」「しょうらいのゆめ」。壁の絵の列に、町のロボットと同じ姿のロボットの絵（名札は赤）\n- **神社（D1）**：額の下の札は「継島再生記念　2034年」。額の写真はガラスの映り込みで顔をやわらげた\n- **お守り（E3）**：広げた紙に、子どもの丸い字で「おかえり／なさい ♡」\n- **線香花火（E2）**：男と子どもの顔が横から見えていたため、夜を深くする色の調整（暗い所をさらに暗く）をかけ、顔の所だけをさらに暗がりに沈めて、ふたりをシルエットにした。闇の中に、線香花火の火の玉とロボットの光の帯だけが浮かぶ。音は合成のパチパチと虫の声\n- **コンビニの看板**：実在のチェーンに似た緑と青のしま模様を、この町の色（茶色としゅ色）に塗り替えた（Veo が「他社のコンテンツ」として断ったため）\n- **終わりのあいさつ**：第一章と同じ声・同じ言葉「つぎまちの一日に、最後までお付き合いいただき、ありがとうございました。また、この町でお会いしましょう。」（シリーズの締めの言葉としてそろえた。Gemini の残高が切れたため、「日曜日に」の版は補充後に作り直せる）\n- **静止画のカット**：B1（喫茶店）と D2（境内の缶蹴り）は Veo が作れなかったため、Veo を作り直すまで原画の静止画にゆっくり寄る。B1 は動きに合わせる音（電車の通過）を外した。D2 は原画に男の横顔と子どもたちの顔がはっきり映っていたため、上の方（夕焼けの塔と空中電車、鳥居の端）だけを使い、缶蹴りは画面の外の音（缶の「カーン」、子どもの声）で伝える。作り直すときは、男を後ろ姿にした原画から\n- **Veo の音**：C6・E4・P0 は頼んでいない音楽のような音があったため、Veo の音を使わず合成した環境音だけにした（`videos/ai-human-coexistence-2/docs/veo_audio_check.md`）\n\n## 第9版：冒頭のつかみと町の声（2026年10月）\n\n- **冒頭のつかみ（H0、16秒）**：本編の前に、この町の一日から4つの瞬間を約4秒ずつ。牛丼屋で丼を置くロボット（C1）→ 左官とロボット、おばちゃんの差し入れ（B2）→ 子どもとロボットの小さな四駆のレース（B4）→ 夜の屋上の三人と飛行車・灯台の光（E4）。最後に「どこにもないのに、知っている景色。」と出て、黒へ落ちてから「2026年8月24日。」の浜へ。最初のコマから見せる（頭の黒からのフェードは0.25秒）。音は牛丼屋の話し声とロボットの「ピ。」、職人たちの話し声とおばちゃんの「ふふ」、子どもたちの歓声と笑い声、飛行車の通過。テーマ曲入り版は、屋上の場面でオルゴールが主題の頭を2小節だけ鳴らし、2026年の浜は曲なしのまま\n- **尺**：7分51秒・31カット。目次は 00:00 序／00:54 一／01:24 二／02:47 三／04:16 あの頃／05:40 四／06:09 五／07:08 結／07:35 次回予告\n- **町の声（せりふにはしない）**：言葉として聞き取れない話し声・子どもの声・笑い声を、ラジオ体操（A2）、左官とおばちゃん（B2、近くの「ふふ」と遠くの男の笑い）、駄菓子屋の前（B3）、小さな四駆（B4、すぐそばの歓声）、昭和のコース（B5）、縁台（B6）、牛丼屋（C1）、島への船（C2）、神社の秋・雪の正月・授業参観（R1〜R3、こもった音）、最後の花火（R5、遠い子どもの笑い）、別れの朝の桟橋（R6）、缶蹴り（D2）、灯りの島（E1）、線香花火（E2、女の子の小さな笑い）に入れた。2026年の浜・麦茶の部屋・交換日記・柱の傷・屋上の三人・結は、声を入れず静かなまま\n- **缶蹴り（D2）の字幕**：「缶蹴りは、夕焼けが消えるまで。」を、作者の言葉「夕方5時の、帰りたくない気持ち。」に置き換えた（数は増やさない）\n- **作者の言葉をテロップで2つ足した**（声には出さない）：2026年の浜（P0）で、通知が鳴り続ける中、男が夕暮れの島へ歩いていくところに「いつから、夕焼けを見なくなったんだろう。」。昭和の別れの朝（R6）、島を離れる少年と見送る女の子の桟橋に「あれが最後の夏だったなんて。」。どちらも、男の心の中と、失ったものを、説明せずに伝えるため\n\n## 第10版：帰郷と振り返りに絞る（2026年10月）\n\n### 作者の指摘と決めたこと\n- 指摘：「動きが不自然な部分、ゆっくりと動いている違和感が多すぎる」「何が伝えたいのか分からない。ストーリーになっていない」。\n  画面で：①駄菓子屋の電話の箱は何がしたいのか分からない ②小さな四駆の動きが不自然 ③カード遊びの子どもの動きが不自然\n  ④船から見える団地の屋上の人が大きすぎる ⑤麦茶のグラスが大きすぎる ⑥ノートをめくる姿が不自然。\n  「スーツの男が来て振り返る」という軸が、町めぐりに変わってしまっている\n- 決めたこと（作者の答え）：**軸は「帰郷と振り返り」**。画像と Veo は作り直さない（残高を補充しない）。町の場面も崩れない数秒と止め絵で少し戻し、**5分半前後**\n- 映像精査（4班で全28本をコマ単位で）：どのカットも 2〜3.6 倍に引き伸ばしていたのが「ゆっくりした違和感」と二重写りの元。\n  Veo の崩れ（缶が消えて火から湧く、お守りが別の物に化ける、煙に頭が溶ける など）も多く、元の速さで使えるのは1カット3〜8秒\n\n### 作り方\n- 動くカットは、崩れない範囲だけを**元の速さ**で（人・手は等速、灯り・景色だけ 1.25〜1.5 倍まで）。`scripts/natural_plan_v10.json`\n- 足りない時間は**原画の止め絵**で：構図を変えた差し込み（カードの寄り、ロボットの日記の寄り、お守りの寄り、別の構図の原画）と、\n  昭和の思い出は「写真から動き出す」形（色あせた写真のまま3〜4秒→そこから元の速さで動く）。同じ構図のまま止め絵から動き出すのは思い出だけ\n- 指摘への答え：①電話の箱は外した ②小さな四駆は動かさず、男の手に四駆がある止め絵だけにして、昭和の同じコースの思い出へつなぐ\n  ③カード遊びは子どもが跳ぶ所を外し、めんこを拾う手と将棋の駒だけ ④屋上の子どもを消した（`scripts/c2_roof_plate.py`・`paint_out.py`。\n  Veo で子どもが4人→6人に増えるので、屋上の手すりの帯ごと、建物の特徴点で追ってきれいな背景に置きかえる） ⑤麦茶のカットは外した\n  ⑥日記はめくらない。止め絵のページで見せる（1986年の子どもふたりの字→毎年同じ一行の大人の字→ロボットの四角い字）\n\n### 構成（第10版）\n| 時刻 | 章 | 場面 | 字幕 |\n|---|---|---|---|\n| 0:00 | 序 | つかみ：夜明けの軽トラ（ロボット74）→島へ向かう船→昭和の屋上の花火→夕暮れの神社 | どこにもないのに、知っている景色。 |\n| 0:15 | 序 | 2026年の浜。通知が鳴りやまない男が、砂丘へ歩く | 2026年8月24日。／あの島を出て、四十年。 |\n| 0:29 | 序 | 夜の砂丘、島の灯りと花火。題「砂の向こうから来た男」 | （題） |\n| 0:44 | 一 朝 | 島へ向かう軽トラ（止め絵）→荷台の男とロボット | 2080年8月25日、日曜日。 |\n| 0:55 | 一 | 浜のラジオ体操（止め絵）→カードの寄り→ロボットが最後の一枠にはんこ | 最後の日のハンコだけ、空いていた。 |\n| 1:12 | 一 | 喫茶店の窓（朝の通りとモノレール、止め絵）→カウンターのサイフォンとモーニング（止め絵）→店の中が動き出す（話すだけで書けるタブレット）→左官とロボット→牛丼屋→路地の将棋（盤と手元の止め絵→路地） | 町は、今日も少しずつ新しくなる。／壁の塗り方は、人がロボットに教える。／牛丼は、今も早い。／将棋のロボットは、ときどき負けてくれる。 |\n| 1:54 | 一 | 駄菓子屋の裏のコース（男の手に小さな四駆）→昭和の同じコース（写真から動き出す） | 同じコースを、あの子と走った。 |\n| 2:09 | 二 昼さがり | 島へ向かう船（止め絵）→船の上の男と古いロボット | 生まれた島へ。 |\n| 2:21 | 二 | 交換日記：1986年の子どもふたりの字→毎年の一行→ロボットの字（2079年「きょうも、だれも こなかった。」、2080年の砂丘の絵） | ある年から、字が変わっていた。 |\n| 2:43 | 二 | 柱の背くらべ（☆S61、S61♡） | 背くらべは、あの夏で止まっている。 |\n| 2:49 | あの頃 | 神社の秋→雪の正月→授業参観→夜の桟橋のふたり→消えていく灯り→最後の花火→別れの朝（'86 8 25 の写真）→桟橋を歩くふたり | 来年も、いっしょに見ようね。／あれが最後の夏だったなんて。 |\n| 3:46 | 三 夕暮れ | 高台の神社（継島再生記念 2034年の額）、五時のチャイム→境内の缶蹴り（男が後ろ姿で缶を蹴って歩き、子どもたちは石段を上っていく） | 島に灯りを戻したのは、あの子だった。／夕方5時の、帰りたくない気持ち。 |\n| 4:01 | 四 夜 | 灯りの島→線香花火（止め絵）→お守りを開く→「おかえりなさい」の寄り→屋上の三人（止め絵）→飛行車 | 消えた窓に、また灯りがともる。／線香花火は、今もぽとりと落ちる。／あの子の字だった。／来年も、いっしょに見ようね。／ピ。 |\n| 4:36 | 結 | 深夜の継町と継島、あいさつ | 変わっていくものと、変わらないもの。／僕の大好きなあの頃は、そのままに。 |\n| 5:07 | 予告 | 窓の外の嵐→雨戸を閉める男とロボット。題「台風の夜」 | 九月。台風が、近づいていた。 |\n\n### 曲（テーマ曲入り版）\n作者の Suno の4曲から、第一章と同じやり方で（`audio/src/suno_plan.json`）。シリーズの印（冒頭のオルゴール、屋上で再び鳴る主題、結の解決）は第一章と同じ音、\nそれ以外は第一章で使っていない区間：朝の町は曲1のつづき（冒頭で止めたフルートの句から）、昭和のコースは曲4の頭のオルゴール、島と島の家は曲4のおわり\n（最後の和音が柱の傷で消える）、思い出は曲2（明るい曲）の中ほどとおわり、チャイムの間は曲なし、チャイムのあとは曲4の中ほど、予告は曲4の低いピアノを小さく。\n題名（0:33〜）は第一章と同じく曲なし（砂と虫の音）。あいさつは最後の和音の約1秒後から\n\n### 残高の補充後の作り直し（2026年10月12日）\n作者が Gemini の残高を補充したので、作れなかった喫茶店（B1）と缶蹴り（D2）を Veo で作り直した。その途中で、納品した第10版に\n約束違反が残っていたのを見つけて直した（全カットを `scripts/qa_faces.py` で点検し、挙がったコマを拡大して確かめた）。\n- **缶蹴り（D2）**：第10版の止め絵は、上だけを使うはずの原画の全体（男の横顔と子どもたちの顔）になっていた。男を後ろ姿、子どもを遠くの後ろ姿にした原画（D2_v3）から Veo。\n  男が歩きながら缶を蹴って転がし、子どもたちのあとから石段を上っていく。元の速さで8秒、缶の音とヒグラシは Veo の音\n- **喫茶店（B1）**：Veo が4回「他社のコンテンツ」と判定した。看板の色・看板の無地化・電車の描き直しでは通らず、窓の外のコンビニの店構え（実在のチェーンの店先に似ていた）を\n  昭和の小さな商店「つぎマート」（木の看板と生成りの日よけ、野菜の木箱）に描き直したら通った（B1_v6）。電車も、実在の通勤電車に似ていたので丸い吊り下げ式の2両に描き直した。\n  奥の女の人は Veo の途中で横顔になるので、頭だけを向こうを向いているコマで止めた。\n  第10版の「窓ぎわ」（B1v）は別の原画で、女の人の正面の顔と、実在のコンビニに似た3色の帯の看板が映っていたので外した。\n  喫茶店は「窓の外の朝の通りとモノレール（止め絵・章題）→カウンターのサイフォンとモーニング（止め絵）→店の中が動き出す」の3カットに（合わせた尺は前と同じ）\n- **昭和のコース（B5）**：少年の笑顔とあの子の横顔が映っていた。ふたりを手前の後ろ姿にした原画（B5_v3）から Veo を2本作り、\n  ふたりが動かず車だけが走る2本目の 3.8〜8.0 秒を使った（写真のまま 5.6 秒→元の速さで 4.2 秒）。それでも少年の頬と目元が少し見える角度だったので、\n  あの子の後ろ姿とコースだけになるよう右寄りに切り抜いた（少年は画面の外。見ている本人の目線になる）\n- **路地の将棋の止め絵（B6s）**：原画に同じスーツの男が2人いた。男が1人の原画（B6_v2）から、将棋盤とロボットの手・おじいさんの手元を切り出した\n- **四駆の止め絵（B4p）**：右上の端に、笑う子どもの顔が入っていた。男の手元と四駆とコースだけになるよう切り抜きを変えた\n- 屋上の三人の止め絵（E4s）の子どもは、拡大しても耳と頬の輪郭だけで目鼻は見えないので、そのまま\n- 尺・カットの頭の時刻は前と同じ（5分20.8秒、喫茶店が1カット増えて44カット）。曲の並べ方も変えていない\n- Veo の費用：D2 1本・B1 1本・B5 2本（判定で弾かれた5回は料金なし）、原画と描き直し 6枚\n\n### 止め絵を動く場面に（2026年10月12日）\n作者の希望で、町と現在の止め絵を Veo で動かした。人はほとんど動かさず、乗り物・海・湯気・灯り・手元を動かす。尺とカットの頭の時刻は変えていない。\n- 軽トラ（A1s）：夜明けの海沿いの道を、男とロボットを荷台に乗せて走り去る。空を飛行車がゆっくり渡る\n- 喫茶店の窓（B1s）：通りを人とロボットが歩く。モノレールは Veo が途中で重ねて3両に増やしたので、空とモノレールの所だけ最初のコマで止めた\n- カウンター（B1v）：サイフォンが泡立ち、コーヒーから湯気。左官を2秒短くした分、2秒長くした\n- 左官（B2s）：職人がこてで壁をひと塗り。5.4秒からこてが手から離れて浮くので、0〜5秒だけ\n- 将棋（B6s）：ロボットが駒をひとつ進め、おじいさんが手を下ろす\n- 四駆（B4p）：男の手がドライバーを回す。奥のコースの車が人の乗ったカートに化けたので、コースの所だけ最初のコマで止めた\n- 島への船（C2s）：島がゆっくり近づき、カモメと飛行車が渡る。屋上の大きすぎる子どもは原画で消してから（C2_v3）\n- 屋上の三人（E4s）：3人は動かず、町と島の灯りがまたたき、蚊取り線香の煙がのぼる。1本目はロボットの頭に青い丸い光が出たので2本目\n- 予告（T0s）：Veo の作り直しは残高が切れて作れなかった。男の横顔が見えていたので、後ろ姿に描き直した原画（T0_v3）の止め絵に\n- ラジオ体操の引き（A2w）：動かすと、浜に急に波が押し寄せて子どもの足もとまで水が来たので、止め絵のまま\n- 動かしたカットの音は、合成の環境音のまま（Veo の音には頼んでいない音楽が入ることがあり、残高切れで試聴できなかったため）\n- 止め絵として残したのは、日記のページ・ロボットの字・お守りの字・カードの寄り（Veo で動かすと字が溶ける）と、昭和の写真（「写真」として見せる所）と、上の2つ\n- 費用：Veo 11本（約7ドル。使ったのは8本。崩れた1本目の T0s・A2w・E4s は使わない）と原画の手直し2枚（約0.3ドル）。途中で残高が切れた\n\n### 残っていること\n- ロボットの肩の番号が、軽トラは74、船は72、神社は71（原画のまま）。同じロボットに見せるなら、番号の焼き直しが要る\n- 船のカットの屋上は、目をこらすと、マストの際にわずかなにじみが残る（全体の大きさではほぼ分からない）\n- 止め絵は 44 カット中 9 カット（字のある紙・昭和の写真・ラジオ体操の引き・予告）。予告とラジオ体操の引きは、残高を補充すれば動かせる\n- 町の人（左官・差し入れのおばちゃん・牛丼屋の客・路地のおじいさん・遠くの通行人や子ども）は、中くらいの大きさで顔が見えるカットがある（主人公の3人は後ろ姿）\n"}, "video": {"parts": [{"name": "v00", "path": "media/ep2/v00.mp4", "size": 18319405, "url": "/_blob/d252ef1d98be03ded4186ad254c32e60", "sha": "01963b871eb4e0e060bd280ab96970f273ff985c989bf1384502f0c80af81f5f"}, {"name": "v01", "path": "media/ep2/v01.mp4", "size": 19343101, "url": "/_blob/dc29f7d413dc61a7fcc425f2f5e6ea94", "sha": "93a6d8bf90a5e5f4395c2f589743c66908a8838712edf34a21c34794e41963f3"}, {"name": "v02", "path": "media/ep2/v02.mp4", "size": 19769438, "url": "/_blob/6299040528d962a654c4e118796ed050", "sha": "a976628b55b931fd3e8aeafcd9c9788afdd1a9c53f73296239b9918c7038bd31"}, {"name": "v03", "path": "media/ep2/v03.mp4", "size": 19351568, "url": "/_blob/df75fc8e0ee7c93cf8f2e4b335c97d47", "sha": "57718d1542893e13f9a291b69e0c91237afb8fbff92f262abafea2 <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(() => {
  const KIT = JSON.parse(document.getElementById('kit-data').textContent);
  const app = document.getElementById('app');
  const LS = 'kioku-kit-v1';
  let state = {};
  try { state = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { state = {}; }
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { /* 保存できない環境でも動く */ } };

  // 保存（downloads）：ビューアの外では null。そのときは保存ボタンを止めて理由を書く
  let downloads = null, dlReady = false;
  const dlPromise = (async () => {
    try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
    dlReady = true; return downloads;
  })();

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
    return n;
  };
  const flash = (btn, label) => {
    const old = btn.dataset.label || btn.textContent; btn.dataset.label = old;
    btn.textContent = label; btn.classList.add('flash');
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove('flash'); }, 1800);
  };
  const selectNode = (node) => { try { const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} };

  // コピー：クリックの中で直接 writeText を呼ぶ。断られたら文字を選んだ状態にする
  const copyBtn = (getText, node, label = 'コピー') => el('button', {class: 'btn', type: 'button', onclick: (ev) => {
    const btn = ev.currentTarget; const text = getText();
    let p;
    try { p = navigator.clipboard.writeText(text); } catch (e) { p = Promise.reject(e); }
    p.then(() => flash(btn, 'コピーしました')).catch(() => { if (node) selectNode(node); flash(btn, '選択しました（長押し・Ctrl+C でコピー）'); });
  }}, label);

  const saveErr = (code) => ({
    declined: '保存をやめました',
    rate_limited: 'ほかの保存の確認が開いています。閉じてから、もう一度押してください',
    too_large: 'このアプリでは大きすぎて保存できません。パソコンのブラウザで開いて保存してください',
    rejected_extension: 'この形式は保存できません',
    extension_not_enabled: 'この形式は、ここでは保存できません',
  }[code] || 'ここでは保存できません。パソコンのブラウザで開いてください');

  // 保存ボタン：getData は文字列か Blob を返す（非同期でもよい）
  const saveBtn = (filename, getData, msg, label = '保存', primary = false) => {
    const b = el('button', {class: 'btn' + (primary ? ' primary' : ''), type: 'button', onclick: async (ev) => {
      const btn = ev.currentTarget;
      await dlPromise;
      if (!downloads) { if (msg) { msg.textContent = 'この画面では保存できません。claude.ai で開くと保存できます'; msg.className = 'msg err'; } return; }

      try {
        const data = await getData(msg);
        await downloads.save({filename: typeof filename === 'function' ? filename() : filename, data});
        flash(btn, '保存しました'); if (msg) { msg.textContent = ''; msg.className = 'msg'; }
      } catch (e) {
        const code = e && e.code;
        if (msg) { msg.textContent = code ? saveErr(code) : ('読み込めませんでした（' + (e && e.message || e) + '）。もう一度押してください'); msg.className = code === 'declined' ? 'msg' : 'msg err'; }
      } finally { btn.disabled = false; }
    }}, label);
    return b;
  };
  const fetchBlob = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); };
  const mb = (n) => (n / 1048576).toFixed(n > 104857600 ? 0 : 1) + ' MB';
  const count = (text, max) => { const n = [...text].length; return el('span', {class: 'count' + (n > max ? ' over' : ''), text: `${n} / ${max} 文字`}); };

  const doneKey = (ep, k) => `${ep.id}:${k}`;
  const stepBox = (ep, k, n, title, where, ...body) => {
    const done = !!state[doneKey(ep, k)];
    const li = el('li', {class: 'step' + (done ? ' done' : ''), id: `${ep.id}-${k}`});
    const cb = el('input', {type: 'checkbox', checked: done, onchange: (e) => { state[doneKey(ep, k)] = e.target.checked; persist(); li.classList.toggle('done', e.target.checked); }});
    li.append(el('div', {class: 'step-h'}, el('h3', {}, el('span', {class: 'n', text: String(n)}), title), where ? el('span', {class: 'where', text: where}) : null,
      el('label', {class: 'check'}, cb, '済')), ...body);
    return li;
  };

  // 動画：分けて載せた束（映像は2つの版で共通、音は版ごと）を読み、元の順につないで一本の MP4 にする
  const partCache = {}, videoCache = {}, listeners = {};
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tell = (key, info) => { (listeners[key] || new Set()).forEach((fn) => fn(info)); };
  const getPart = (part) => {
    const url = part.url || part.path;
    if (!partCache[url]) {
      partCache[url] = fetchBlob(url).then((b) => { if (b.size !== part.size) throw new Error('大きさが合いません'); return b; });
      partCache[url].catch(() => { delete partCache[url]; });
    }
    return partCache[url];
  };
  function loadVideo(ep, ver) {
    const key = ep.id + ':' + ver;
    if (videoCache[key]) return videoCache[key];
    const v = ep.video;
    const p = (async () => {
      const need = [...new Set(v.slices[ver].map((x) => x[0]))];
      const total = need.reduce((a, i) => a + v.parts[i].size, 0);
      const got = {}; let done = 0, next = 0;
      tell(key, {done, total});
      const worker = async () => {
        while (next < need.length) {
          const i = need[next++];
          got[i] = await getPart(v.parts[i]);
          done += v.parts[i].size; tell(key, {done, total});
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      const pieces = [b64(v.head[ver])];
      for (const [i, off, len] of v.slices[ver]) pieces.push(got[i].slice(off, off + len));
      if (v.tail[ver]) pieces.push(b64(v.tail[ver]));
      const blob = new Blob(pieces, {type: 'video/mp4'});
      if (blob.size !== v.size[ver]) throw new Error('組み立てた大きさが合いません');
      tell(key, {done: total, total, blob});
      return blob;
    })();
    videoCache[key] = p;
    p.catch((e) => { delete videoCache[key]; tell(key, {error: e}); });
    return p;
  }

  // 試写：軽い 480p を2つに分けて載せてある。つないで、このページで再生する
  function loadPreview(ep, ver) {
    const key = ep.id + ':' + ver + ':pv';
    if (videoCache[key]) return videoCache[key];
    const pv = ep.preview[ver];
    const p = (async () => {
      const total = pv.parts.reduce((a, x) => a + x.size, 0); let done = 0;
      tell(key, {done, total});
      const blobs = [];
      for (const part of pv.parts) { blobs.push(await getPart(part)); done += part.size; tell(key, {done, total}); }
      const blob = new Blob(blobs, {type: 'video/mp4'});
      tell(key, {done: total, total, blob});
      return blob;
    })();
    videoCache[key] = p;
    p.catch((e) => { delete videoCache[key]; tell(key, {error: e}); });
    return p;
  }

  function videoStep(ep, ver) {
    const v = ep.video;

    const msg = el('div', {class: 'msg'});
    const bar = el('i');
    const box = el('div', {class: 'player'});
    const fname = `${KIT.series}_${ep.num}_${ep.versions[ver].label}.mp4`;
    const pv = ep.preview && ep.preview[ver];
    const show = (blob) => {
      if (box.firstChild) return;
      const vid = el('video', {controls: true, playsinline: true, preload: 'metadata', src: URL.createObjectURL(blob)});
      vid.addEventListener('error', () => { msg.textContent = 'この画面では再生できません。保存してから再生してください'; msg.className = 'msg'; });
      box.append(vid);
    };
    const progress = (what) => (info) => {
      if (!msg.isConnected) return;
      if (info.error) { msg.textContent = '読み込めませんでした（' + (info.error.message || info.error) + '）。もう一度押してください'; msg.className = 'msg err'; return; }
      bar.style.width = (100 * info.done / Math.max(1, info.total)).toFixed(1) + '%';
      msg.className = 'msg';
      if (info.blob) {
        if (what === 'pv') { msg.textContent = '試写を再生できます（480p）'; show(info.blob); }
        else msg.textContent = `読み込みました（${mb(info.blob.size)}）`;
      } else msg.textContent = `${what === 'pv' ? '試写を' : '元の画質の動画を'}読み込み中… ${mb(info.done)} / ${mb(info.total)}`;
    };
    (listeners[key] = listeners[key] || new Set()).add(progress('full'));
    (listeners[pkey] = listeners[pkey] || new Set()).add(progress('pv'));
    if (videoCache[pkey]) videoCache[pkey].then((blob) => show(blob)).catch(() => {});
    const pvBtn = pv ? el('button', {class: 'btn', type: 'button', onclick: () => { loadPreview(ep, ver).catch(() => {}); }}, `試写（480p・${mb(pv.size)}）`) : null;
    const save = saveBtn(fname, () => loadVideo(ep, ver), msg, `${ep.versions[ver].label}版を保存`, true);
    return [
      el('div', {class: 'item'},
        el('div', {class: 'item-h'}, el('span', {class: 'label', text: `MP4・1920×1080・30fps・${mb(v.size[ver])}`}), el('span', {class: 'btns'}, pvBtn, save)),
        el('div', {class: 'dl'}, el('div', {class: 'bar'}, bar), msg),
        box,
        el('p', {class: 'note', text: v.note}))
    ];
  }

  function renderIndex() {
    document.title = '記憶の路地裏 投稿キット';
    app.replaceChildren(
      el('section', {}, el('p', {class: 'eyebrow', text: KIT.series}), el('p', {class: 'lead', text: KIT.lead})),
      el('div', {class: 'cards'}, KIT.episodes.map((ep) => {
        const keys = ['video', 'title', 'desc', 'thumb', 'audience', 'details', 'after'];
        const n = keys.filter((k) => state[doneKey(ep, k)]).length;
        const fill = el('i'); fill.style.width = (100 * n / keys.length) + '%';
        return el('a', {class: 'card', href: '#' + ep.id},
          el('img', {src: ep.thumbs[0].file, alt: `${ep.num}のサムネイル`, loading: 'lazy'}),
          el('div', {}, el('p', {class: 'eyebrow', text: `${KIT.series}　${ep.num}`}), el('h2', {text: ep.title})),
          el('div', {class: 'meta'}, el('span', {}, '長さ ', el('span', {class: 'num', text: ep.duration})), el('span', {text: ep.hook})),
          el('div', {class: 'progress'}, el('span', {text: `投稿の手順 ${n} / ${keys.length}`}), el('span', {class: 'bar'}, fill)));
      })),
    );
  }

  function renderEp(ep) {
    document.title = `${ep.num} ${ep.title}｜記憶の路地裏 投稿キット`;
    let ver = state[ep.id + ':ver'] || 'theme';
    const head = el('section', {class: 'ep-head'});
    const steps = el('ol', {class: 'steps'});
    const draw = () => {
      const V = ep.versions[ver];
      const seg = el('div', {class: 'seg', role: 'group', 'aria-label': '音の版'}, Object.entries(ep.versions).map(([k, x]) =>
        el('button', {type: 'button', 'aria-pressed': String(k === ver), onclick: () => { ver = k; state[ep.id + ':ver'] = k; persist(); draw(); }}, x.label)));
      head.replaceChildren(
        el('img', {src: ep.thumbs[0].file, alt: `${ep.num}のサムネイル A`}),
        el('div', {}, el('p', {class: 'eyebrow', text: `${KIT.series}　${ep.num}`}), el('h2', {text: ep.title}),
          el('p', {class: 'hookline', text: ep.hook}),
          el('div', {class: 'facts'}, el('span', {}, '長さ ', el('b', {text: ep.duration})), el('span', {}, '章 ', el('b', {text: String(ep.chapters.length)})), el('span', {text: 'セリフなし・町の音と声'})),
          seg, el('p', {class: 'seg-note', text: V.note})));

      const titleText = el('p', {class: 'text title', text: V.title});
      const altText = el('p', {class: 'text title', text: ep.altTitle});
      const linkKey = ep.id + ':link';
      const descOf = () => { const u = (state[linkKey] || '').trim(); return u ? V.description.replace(ep.link.placeholder, u) : V.description; };
      const descText = el('pre', {class: 'text long', text: descOf()});
      const descMsg = el('div', {class: 'msg'});
      const descCount = el('span', {}, count(descOf(), 5000));
      const linkIn = el('input', {class: 'url', id: ep.id + '-link', type: 'url', inputmode: 'url', placeholder: 'https://youtu.be/…', value: state[linkKey] || '',
        oninput: (e) => { state[linkKey] = e.target.value; persist(); descText.textContent = descOf(); descCount.replaceChildren(count(descOf(), 5000)); }});
      const tagsLine = el('p', {class: 'text', text: ep.tags});
      const shortText = el('p', {class: 'text', text: ep.short});

      const thumbs = el('div', {class: 'thumbs'}, ep.thumbs.map((t) => {
        const m = el('div', {class: 'msg'});
        return el('figure', {class: 'thumb', style: 'margin:0'},
          el('img', {src: t.file, alt: `サムネイル ${t.key}`, loading: 'lazy'}),
          el('div', {class: 'item-h'}, el('b', {text: `案 ${t.key}`}), t.rec ? el('span', {class: 'rec', text: 'おすすめ'}) : null,
            el('span', {class: 'btns'}, saveBtn(`${KIT.series}_${ep.num}_サムネイル${t.key}.jpg`, () => fetchBlob(t.file), m, '保存'))),
          el('figcaption', {class: 'note', text: t.note}), m);
      }));

      steps.replaceChildren(
        stepBox(ep, 'video', 1, '動画ファイル', 'YouTube Studio →「作成」→「動画をアップロード」', ...videoStep(ep, ver)),
        stepBox(ep, 'title', 2, 'タイトル', '詳細 → タイトル（100文字まで）',
          el('div', {class: 'item'}, el('div', {class: 'item-h'}, el('span', {class: 'label', text: `${V.label}版`}), count(V.title, 100), el('span', {class: 'btns'}, copyBtn(() => V.title, titleText))), titleText),
          el('div', {class: 'item'}, el('div', {class: 'item-h'}, el('span', {class: 'label', text: '別案（スマホで最初に見える所に、この章だけのひと言）'}), count(ep.altTitle, 100), el('span', {class: 'btns'}, copyBtn(() => ep.altTitle, altText))), altText)),
        stepBox(ep, 'desc', 3, '説明（概要欄）', '詳細 → 説明（5,000文字まで）。目次の時刻から章が自動で作られます',
          el('div', {class: 'item'}, el('div', {class: 'item-h'}, el('span', {class: 'label', text: `${V.label}版`}), descCount,
            el('span', {class: 'btns'}, copyBtn(() => descOf(), descText), saveBtn(`${KIT.series}_${ep.num}_概要欄_${V.label}.txt`, async () => descOf(), descMsg, 'テキストで保存'))), descText, descMsg,
            el('label', {class: 'link-row', for: ep.id + '-link'}, el('span', {class: 'label', text: `${ep.link.label}（入れると「${ep.link.placeholder}」の所に入ります）`}), linkIn)),
          el('div', {class: 'item'}, el('span', {class: 'label', text: '目次（チャプター）'}), el('dl', {class: 'toc'}, ep.chapters.map(([t, name]) => [el('dt', {text: t}), el('dd', {text: name})])))),
        stepBox(ep, 'thumb', 4, 'サムネイル', '詳細 → サムネイル →「ファイルをアップロード」（1280×720・2MB未満）', thumbs),
        stepBox(ep, 'audience', 5, '再生リスト・視聴者', '詳細 → 再生リスト／視聴者',
          el('ul', {class: 'plain'}, ep.settings.audience.map((s) => el('li', {text: s})))),
        stepBox(ep, 'details', 6, '改変コンテンツ・タグ', '詳細 →「すべて表示」',
          el('ul', {class: 'plain'}, ep.settings.details.map((s) => el('li', {text: s}))),
          el('div', {class: 'item'}, el('div', {class: 'item-h'}, el('span', {class: 'label', text: 'タグ（カンマ区切りのまま貼れます）'}), count(ep.tags, 500), el('span', {class: 'btns'}, copyBtn(() => ep.tags, tagsLine))),
            el('div', {class: 'tags'}, ep.tags.split(',').map((t) => el('span', {text: t})))),
          el('div', {class: 'item'}, el('span', {class: 'label', text: '気をつけること'}), el('ul', {class: 'plain'}, ep.settings.cautions.map((s) => el('li', {text: s}))))),
        stepBox(ep, 'after', 7, '公開のあと', '固定コメント・終了画面・もう一つの章',
          el('div', {class: 'item'}, el('div', {class: 'item-h'}, el('span', {class: 'label', text: '固定コメント・コミュニティ投稿・SNS 用の紹介文'}), el('span', {class: 'btns'}, copyBtn(() => ep.short, shortText))), shortText),
          el('ul', {class: 'plain'}, ep.settings.after.map((s) => el('li', {text: s})))),
      );
    };
    draw();

    const mdBox = el('div', {class: 'md'});
    const mdMsg = el('div', {class: 'msg'});
    try { if (window.marked) mdBox.innerHTML = window.marked.parse(ep.script.text); else throw new Error('no marked'); }
    catch (e) { mdBox.replaceChildren(el('pre', {style: 'white-space:pre-wrap', text: ep.script.text})); }
    const script = el('section', {class: 'script', id: ep.id + '-script'},
      el('div', {class: 'item-h'}, el('h3', {style: 'margin:0;font-size:17px', text: ep.script.name}),
        el('span', {class: 'btns'}, copyBtn(() => ep.script.text, mdBox, '全文をコピー'), saveBtn(ep.script.file, async () => ep.script.text, mdMsg, 'Markdown で保存'))),
      el('p', {class: 'note', text: ep.script.note}), mdBox, mdMsg);

    app.replaceChildren(el('a', {class: 'back', href: '#'}, '← 一覧へ'), head, steps, script);
    window.scrollTo(0, 0);
  }

  const route = () => {
    const id = (location.hash || '').slice(1);
    const ep = KIT.episodes.find((e) => e.id === id);
    if (ep) renderEp(ep); else renderIndex();
  };
  window.addEventListener('hashchange', route);
  route();
})();
</script>
